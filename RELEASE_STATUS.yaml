# Universal release status — PMI
#
# Single source of truth for "how done is this paper". This file exists so that
# "done" is never ambiguous between: model done / paper done / reviewed /
# public / submitted.
#
# Rule: a `true` here must name the evidence that established it. A field that
# has not been checked is `false`, not omitted. An absent field reads as "not
# applicable"; an explicit `false` reads as "checked and the answer is no".

paper:
  title: "Ratings Are Not Forecasts: Accounting, Calibration, and Information Timing in NBA Player-Impact Forecasting"
  author: Geoffrey Hadfield
  affiliation: World model Sports LLC
  role: CEO/founder
  identity: PMI
  repository_slug: pmi-ratings-forecasts
  author_confirmation: "operator supplied 2026-10-01; confirm paper-specific coauthors before release"

status:
  # The frozen reported experiment (models, offsets, split) was fixed before the
  # 2023-24/2024-25 holdout was read. That is what "science_frozen" means here.
  # It does NOT mean the holdout is reusable: see holdout_spent.
  science_frozen: true
  holdout_spent: true            # 2023-24 and 2024-25 are exposed; not untouched validation
  abstract_frozen: true          # 402 words incl. title/body/table; four sections; one table
  clean_reproduction_passed: true    # evidence: REPRODUCTION_RECEIPT.json (clean clone, 2026-10-01)
  independent_review_passed: true    # INDEPENDENT_REVIEW.md: APPROVE, PMI-R01 closed (science/RC1 layer)
  release_hygiene_review_passed: true  # RC2 freeze review APPROVE after remediation; see REVIEW.md
  rights_inventory_complete: true    # DATA_INVENTORY.json enumerates every tracked artifact
  rights_review_passed: false        # RIGHTS.md is explicitly NOT publication-cleared; gate G1 open
  hermetic_environment: true         # pyproject.toml + transitive uv.lock; verified by clean-clone run
  user_publication_approval: false   # P6 — Geoffrey's explicit approval. NOT GIVEN.
  public_repository_created: false
  public_reproduction_passed: false
  submitted: false

reproduction_levels:
  L1_reported_statistics_replay: true       # reproduce.py from the four tracked data files
  L2_evaluation_table_reconstruction: true  # LOCAL_SOURCE_RECONSTRUCTION.json, local source checkout
  L3_raw_source_refit: false                # never executed; do not imply it from code presence

